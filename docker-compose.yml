# docker-compose.yml (ATUALIZADO)
services:
  database:
    image: postgres:15
    container_name: financial_db
    environment:
      POSTGRES_DB: financial_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial_network

  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: financial_api
    environment:
      - DATABASE_URL=postgresql://admin:password123@database:5432/financial_db
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      - database
    networks:
      - financial_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financial_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - CHOKIDAR_USEPOLLING=true 
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - financial_network

volumes:
  postgres_data:

networks:
  financial_network:
    driver: bridge